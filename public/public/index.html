<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concord — Autonomous Payroll Agent</title>
<style>
  :root { --bg:#0b0f17; --card:#151b27; --txt:#e8edf5; --muted:#8b97a8; --accent:#a78bfa; --green:#36d399; --amber:#fbbd23; --red:#f87272; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); padding:24px; }
  .wrap { max-width:820px; margin:0 auto; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .logo { width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,#2a1f4d,#1b2440); display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--accent); font-weight:800; }
  h1 { font-size:23px; margin:0; }
  .tag { color:var(--muted); font-size:14px; margin-bottom:18px; }
  .pill { display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:600; margin:4px 6px 4px 0; }
  .pill.live { background:rgba(54,211,153,.15); color:var(--green); }
  .pill.fund { background:rgba(251,189,35,.15); color:var(--amber); }
  .pill.ok { background:rgba(167,139,250,.15); color:var(--accent); }
  .hero { background:linear-gradient(135deg,#1b2440,#151b27); border:1px solid #243049; border-radius:16px; padding:16px 20px; margin-bottom:20px; font-size:14px; line-height:1.5; }
  .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid #222c3e; border-radius:14px; padding:14px; }
  .stat .v { font-size:22px; font-weight:700; }
  .stat .l { font-size:12px; color:var(--muted); margin-top:4px; }
  .section-title { font-size:15px; color:var(--muted); margin:18px 0 10px; text-transform:uppercase; letter-spacing:.5px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:13px; }
  th { text-align:left; padding:10px 12px; color:var(--muted); font-weight:600; border-bottom:1px solid #222c3e; }
  td { padding:10px 12px; border-bottom:1px solid #1a2233; }
  .ok { color:var(--green); font-weight:600; }
  .pend { color:var(--amber); font-weight:600; }
  code { background:#1c2434; padding:1px 6px; border-radius:5px; color:#aab6cc; font-size:12px; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">C</div>
    <div>
      <h1>Concord</h1>
      <div class="tag">Autonomous payroll &amp; subscription agent · Arc Testnet</div>
    </div>
  </header>

  <div class="hero" id="hero">Loading Concord status…</div>
  <div id="pills"></div>

  <div class="stats" id="stats"></div>

  <div class="section-title">Live Settlement Stream</div>
  <table>
    <thead><tr><th>Time</th><th>Subscription</th><th>Receiver</th><th>Amount</th><th>Tx</th><th>Status</th></tr></thead>
    <tbody id="stream"><tr><td colspan="6" style="color:var(--muted);text-align:center;padding:20px">Waiting for settlements…</td></tr></tbody>
  </table>

  <footer>Built on Arc testnet · powered by Circle Programmable Payments · <code>0xd25A…5a0F</code></footer>
</div>

<script>
async function load() {
  let d;
  try { d = await (await fetch("state.json",{cache:"no-store"})).json(); }
  catch(e){ document.getElementById("hero").textContent="Warming up…"; return; }
  document.getElementById("hero").innerHTML = `<strong>Concord is running.</strong> ${d.description}`;
  document.getElementById("pills").innerHTML =
    `<span class="pill ok">Vault: ${d.vaultBalance??0} USDC</span>` +
    (d.walletFunded?`<span class="pill live">● Agent funded</span>`:`<span class="pill fund">● Top up</span>`) +
    `<span class="pill live">● ${d.subscriptions.length} active</span>`;
  document.getElementById("stats").innerHTML = [
    ["Vault Balance", (d.vaultBalance??0)+" USDC"],
    ["Subscriptions", d.subscriptions.length],
    ["Total Settled", (d.totalSettled??0)+" USDC"],
    ["Last Run", d.lastRun?d.lastRun.slice(11,19):"—"],
  ].map(([l,v])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  const rows = (d.settlements||[]).slice(0,12).map(s=>`
    <tr>
      <td>${s.time}</td>
      <td>${s.sub}</td>
      <td><code>${s.to.slice(0,10)}…</code></td>
      <td>${s.amount} USDC</td>
      <td><code>${s.tx.slice(0,12)}…</code></td>
      <td class="ok">SUCCESS</td>
    </tr>`).join("");
  document.getElementById("stream").innerHTML = rows || `<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:20px">No settlements yet</td></tr>`;
}
load(); setInterval(load, 15000);
</script>
</body>
</html>
